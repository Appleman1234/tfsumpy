[project]
name = "tfsumpy"
version = "0.2.1+catalyst.1"
description = "A Python tool for Terraform state summary"
authors = [
    { name = "Rafael H de Carvalho", email = "rafaelherik@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = "MIT"
keywords = ["terraform", "infrastructure", "cloud", "DevOps"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "PyYAML>=5.1",
    "jsonschema>=3.2.0",
    "colorama>=0.4.6",
    "jinja2>=3.1.6,<4.0",
    "deepdiff>=8.6.1,<9.0",
    "jsondiff>=2.2.1,<3.0",
]

[project.urls]
BugTracker = "https://github.com/Appleman1234/tfsumpy/issues"
SourceCode = "https://github.com/Appleman1234/tfsumpy"
Repository = "https://github.com/Appleman1234/tfsumpy"
Documentation = "https://github.com/Appleman1234/tfsumpy"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.6.1",
    "coverage>=7.2.0",
    "bandit>=1.7.8",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
tfsumpy = "tfsumpy.__main__:main"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.6.1",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-colorama",
    "coverage>=7.2.0",
    "bandit>=1.7.8",
]

[tool.poetry]
packages = [{ include = "tfsumpy" }]

[[tool.mypy.overrides]]
module = ["deepdiff.*", "jsondiff.*"]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

